name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Checks
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@ec457510b197b2eeb8b2ea2d182f31e3ed7157bd # v2.3.3
    with:
      os: ubuntu-latest
      flake-check: false
      clippy: true
      clippy-command: |
        cargo clippy --locked --workspace --all-targets -- -D warnings
        sysroot=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot
        env "BINDGEN_EXTRA_CLANG_ARGS_aarch64-linux-android=--target=aarch64-linux-android28 --sysroot=$sysroot" \
          cargo ndk -t arm64-v8a -P 28 clippy --locked --workspace --exclude sigscan -- -D warnings
        env "BINDGEN_EXTRA_CLANG_ARGS_armv7-linux-androideabi=--target=armv7-linux-androideabi28 --sysroot=$sysroot" \
          cargo ndk -t armeabi-v7a -P 28 clippy --locked --workspace --exclude sigscan -- -D warnings
      test: true
      test-command: cargo test --locked --workspace

  ios:
    name: iOS
    uses: ./.github/workflows/ios.yml # zizmor: ignore[self-repository]

  actions:
    name: Actions Lint
    uses: manic-systems/workflows/.github/workflows/actions-lint.yml@ec457510b197b2eeb8b2ea2d182f31e3ed7157bd # v2.3.3

  required:
    name: Required Checks
    if: always()
    needs:
      - checks
      - ios
      - actions
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
