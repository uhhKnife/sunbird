name: site
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  ios:
    uses: ./.github/workflows/ios.yml # zizmor: ignore[self-repository]
  # The desktop launchers and loaders. Ubuntu 22.04 links the Linux loader
  # against an older glibc than Discord's AppImage needs, so it loads anywhere
  # Discord runs. macOS Phoenix is arm64 only, which macos-15 builds natively.
  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-msvc
            files: |
              target/release/phoenix.dll
              target/release/phoenix-inject.exe
          - os: ubuntu-22.04
            toolchain: stable
            files: target/release/libphoenix.so
          - os: macos-15
            toolchain: stable
            files: target/release/libphoenix.dylib
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '13.0' || '' }}
        run: cargo +${{ matrix.toolchain }} build --locked --release -p phoenix-loader ${{ runner.os == 'Windows' && '-p phoenix-inject' || '' }}
      # The linker's signature loads, but AMFI logs a complaint about it.
      - if: runner.os == 'macOS'
        run: codesign --force --sign - target/release/libphoenix.dylib
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
  build:
    needs: [ios, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix develop --command nu scripts/site.nu web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libphoenix-ios
          path: ios
      - run: mv ios/libphoenix.dylib web/plugins/libphoenix-ios.dylib
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: desktop
      - run: |
          mv desktop/desktop-Windows/phoenix.dll web/plugins/phoenix-windows-x86_64.dll
          mv desktop/desktop-Windows/phoenix-inject.exe web/plugins/sunbird-windows-x86_64.exe
          mv desktop/desktop-Linux/libphoenix.so web/plugins/libphoenix-linux-x86_64.so
          mv desktop/desktop-macOS/libphoenix.dylib web/plugins/libphoenix-macos-arm64.dylib
          cp scripts/sunbird-linux.sh web/plugins/sunbird-linux.sh
          cp scripts/sunbird-macos.sh web/plugins/sunbird-macos.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The plugins stay TypeScript in plugins/*/src; assets.sunbird.tools serves them bundled.
      - run: npm install --no-save --no-package-lock esbuild@0.25.12 # zizmor: ignore[adhoc-packages]
      - run: node web/tools/bundle-plugins.ts
        env:
          ESBUILD: node_modules/.bin/esbuild
      - run: |
          mkdir -p dist
          touch dist/.nojekyll
          cp -r web/pkg web/plugins web/version.json dist/
          tar czf dist/site.tar.gz -C web pkg plugins version.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
